[package]
name = "acme-v2"
description = "Library for requesting certificates from an ACME V2 provider."
license = "MIT"
repository = "https://github.com/luizfonseca/acme-v2"
readme = "README.md"
version = "0.9.4"
authors = [
  "Luiz Fonseca <toaster.chicory-0b@icloud.com>",
  "Martin Algesten <martin@algesten.se>",
]
keywords = ["letsencrypt", "acme"]
categories = ["web-programming", "api-bindings"]
edition = "2024"
rust-version = "1.88"

[dependencies]
base64 = "0.22.1"
log = "0.4"
openssl = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }

[dev-dependencies]
env_logger = { version = "0.11", default-features = false }
